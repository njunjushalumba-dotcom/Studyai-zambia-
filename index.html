<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chenjela — Study Smart</title><link rel="icon" type="image/svg+xml" href=""/>
<link rel="apple-touch-icon" href=""/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#1a1a1a;color:#ffffff}
.login-bg{min-height:100vh;background:#1a1a1a;display:flex;align-items:center;justify-content:center}
.login-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:40px 32px;width:100%;max-width:420px}
.logo{font-family:'Playfair Display',serif;font-size:32px;color:#fff;margin-bottom:4px}
.logo span{color:#f5b400}
.tagline{font-size:13px;color:#8899bb;margin-bottom:32px}
.role-btn{width:100%;padding:16px 20px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;gap:14px;transition:all 0.2s}
.role-btn:hover{background:rgba(42,82,152,0.3);border-color:#2a5298}
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:rgba(255,255,255,0.03);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;overflow-y:auto}
.sidebar-logo{font-family:'Playfair Display',serif;font-size:20px;color:#fff;padding:0 8px;margin-bottom:4px}
.sidebar-logo span{color:#f5b400}
.sidebar-role{font-size:11px;color:#8899bb;padding:0 8px;margin-bottom:24px;text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#8899bb;transition:all 0.2s;margin-bottom:4px}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#e8eaf6}
.nav-item.active{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;font-weight:600}
.sidebar-bottom{margin-top:auto}
.points-chip{background:rgba(245,180,0,0.1);border:1px solid rgba(245,180,0,0.2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#f5b400;font-weight:600;margin-bottom:12px}
.logout-btn{width:100%;padding:10px;background:rgba(255,60,60,0.08);border:1px solid rgba(255,60,60,0.15);border-radius:10px;color:#ff6b6b;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer}
.main{flex:1;overflow-y:auto;padding:24px 28px}
.page-title{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:4px}
.page-sub{font-size:13px;color:#8899bb;margin-bottom:24px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:18px}
.stat-icon{font-size:26px;margin-bottom:8px}
.stat-val{font-size:26px;font-weight:700;margin-bottom:2px}
.stat-label{font-size:12px;color:#8899bb}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px}
.chat-area{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:82%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.6}
.msg.user{background:linear-gradient(135deg,#1a3a6e,#2a5298);align-self:flex-end;border-bottom-right-radius:4px}
.msg.assistant{background:rgba(255,255,255,0.06);align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap}
.chat-input-row{display:flex;gap:10px}
.chat-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:11px 15px;color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:14px;outline:none}
.chat-input:focus{border-color:#2a5298}
.primary-btn{background:linear-gradient(135deg,#1a3a6e,#2a5298);border:none;border-radius:12px;padding:11px 22px;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.primary-btn:disabled{opacity:0.4;cursor:not-allowed}
.send-btn{background:linear-gradient(135deg,#1a3a6e,#2a5298);border:none;border-radius:12px;padding:11px 18px;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.select-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.select-pill{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 14px;font-size:13px;color:#8899bb;cursor:pointer;font-family:'Outfit',sans-serif}
.select-pill.active{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;border-color:transparent;font-weight:600}
.quiz-opt{width:100%;padding:13px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:14px;cursor:pointer;margin-bottom:9px;text-align:left;transition:all 0.2s}
.quiz-opt:hover{background:rgba(42,82,152,0.2)}
.quiz-opt.correct{background:rgba(0,200,100,0.15);border-color:#00c864;color:#00c864}
.quiz-opt.wrong{background:rgba(255,60,60,0.15);border-color:#ff3c3c;color:#ff6b6b}
.progress-bar-bg{background:rgba(255,255,255,0.06);border-radius:8px;height:7px;margin-bottom:5px}
.progress-bar{height:7px;border-radius:8px;background:linear-gradient(90deg,#2a5298,#f5b400);transition:width 0.5s}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 10px;text-align:center}
.badge-item.earned{border-color:rgba(245,180,0,0.3);background:rgba(245,180,0,0.05)}
.badge-emoji{font-size:26px;margin-bottom:5px}
.badge-name{font-size:11px;font-weight:600;margin-bottom:2px}
.badge-desc{font-size:10px;color:#8899bb}
.leaderboard-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;margin-bottom:7px;background:rgba(255,255,255,0.03)}
.leaderboard-row.you{background:rgba(42,82,152,0.15);border:1px solid rgba(42,82,152,0.2)}
.notif-item{display:flex;gap:12px;padding:13px;border-radius:12px;background:rgba(255,255,255,0.03);margin-bottom:9px;border:1px solid rgba(255,255,255,0.05)}
.textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:13px;color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:14px;resize:vertical;min-height:150px;outline:none;line-height:1.6}
.feedback-box{background:rgba(0,200,100,0.05);border:1px solid rgba(0,200,100,0.15);border-radius:12px;padding:14px;font-size:13px;line-height:1.8;color:#c8d0e8;white-space:pre-wrap;margin-top:12px}
.notes-box{background:rgba(42,82,152,0.1);border:1px solid rgba(42,82,152,0.2);border-radius:12px;padding:16px;font-size:14px;line-height:1.8;color:#c8d0e8;margin-bottom:14px}
.t-tab{padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#8899bb;font-family:'Outfit',sans-serif}
.t-tab.active{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;border-color:transparent;font-weight:600}
.student-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:rgba(255,255,255,0.03);margin-bottom:7px}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.green-chip{background:rgba(0,200,100,0.1);color:#00c864;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
.red-chip{background:rgba(255,60,60,0.1);color:#ff6b6b;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
.yellow-chip{background:rgba(245,180,0,0.1);color:#f5b400;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
@media(max-width:768px){
.sidebar{width:56px}
.sidebar-logo span:last-child,.sidebar-role,.nav-item span:not(:first-child),.points-chip span:last-child{display:none}
.nav-item{justify-content:center;padding:10px}
.main{padding:18px 14px}
.grid2,.grid3{grid-template-columns:1fr}
.badge-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
