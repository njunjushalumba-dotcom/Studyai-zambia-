TYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0a0f1e"/>
<meta name="description" content="Chenjela — AI Study Assistant for Zambian Secondary School Students"/>
<link rel="manifest" href="manifest.json"/>
<title>Chenjela — Study Smart</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#0a0f1e;color:#e8eaf6;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0f1e}::-webkit-scrollbar-thumb{background:#2a5298;border-radius:4px}

/* LOGIN */
.login-bg{min-height:100vh;background:linear-gradient(135deg,#0a0f1e 0%,#0d1f3c 50%,#0a0f1e 100%);display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.login-bg::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(42,82,152,0.15) 0%,transparent 70%);top:-100px;right:-100px;border-radius:50%}
.login-bg::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(255,180,0,0.08) 0%,transparent 70%);bottom:-50px;left:-50px;border-radius:50%}
.login-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:48px 40px;width:100%;max-width:440px;position:relative;z-index:1}
.logo{font-family:'Playfair Display',serif;font-size:32px;color:#fff;margin-bottom:4px}
.logo span{color:#f5b400}
.tagline{font-size:13px;color:#8899bb;margin-bottom:36px}
.login-title{font-size:20px;font-weight:600;margin-bottom:8px}
.login-sub{font-size:13px;color:#8899bb;margin-bottom:28px}
.role-btn{width:100%;padding:16px 20px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;gap:14px;transition:all 0.2s}
.role-btn:hover{background:rgba(42,82,152,0.3);border-color:#2a5298;transform:translateX(4px)}

/* APP SHELL */
.app-shell{display:flex;height:100vh;overflow:hidden;background:#0a0f1e}
.sidebar{width:240px;background:rgba(255,255,255,0.03);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;padding:24px 16px;flex-shrink:0;overflow-y:auto}
.sidebar-logo{font-family:'Playfair Display',serif;font-size:22px;color:#fff;padding:0 8px;margin-bottom:4px}
.sidebar-logo span{color:#f5b400}
.sidebar-role{font-size:11px;color:#8899bb;padding:0 8px;margin-bottom:28px;text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#8899bb;transition:all 0.2s;margin-bottom:4px}
.nav-item:hover{background:rgba(255,255,255,0.05);color:#e8eaf6}
.nav-item.active{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;font-weight:600}
.nav-icon{font-size:18px;width:24px;text-align:center}
.sidebar-bottom{margin-top:auto}
.points-chip{background:rgba(245,180,0,0.1);border:1px solid rgba(245,180,0,0.2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#f5b400;font-weight:600;margin-bottom:12px}
.logout-btn{width:100%;padding:10px;background:rgba(255,60,60,0.08);border:1px solid rgba(255,60,60,0.15);border-radius:10px;color:#ff6b6b;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;transition:all 0.2s}
.logout-btn:hover{background:rgba(255,60,60,0.15)}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:28px 32px}
.page-title{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:4px}
.page-sub{font-size:13px;color:#8899bb;margin-bottom:28px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:20px}
.stat-icon{font-size:28px;margin-bottom:10px}
.stat-val{font-size:28px;font-weight:700;margin-bottom:2px}
.stat-label{font-size:12px;color:#8899bb}
.section-title{font-size:16px;font-weight:600;margin-bottom:14px}

/* CHAT */
.chat-area{height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;padding-right:4px}
.msg{max-width:82%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.6}
.msg.user{background:linear-gradient(135deg,#1a3a6e,#2a5298);align-self:flex-end;border-bottom-right-radius:4px}
.msg.assistant{background:rgba(255,255,255,0.06);align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap}
.chat-input-row{display:flex;gap:10px}
.chat-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:14px;outline:none}
.chat-input:focus{border-color:#2a5298}

/* BUTTONS */
.primary-btn{background:linear-gradient(135deg,#1a3a6e,#2a5298);border:none;border-radius:12px;padding:12px 24px;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.primary-btn:hover{opacity:0.85}
.primary-btn:disabled{opacity:0.4;cursor:not-allowed}
.send-btn{background:linear-gradient(135deg,#1a3a6e,#2a5298);border:none;border-radius:12px;padding:12px 20px;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}

/* PILLS */
.select-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.select-pill{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:6px 16px;font-size:13px;color:#8899bb;cursor:pointer;transition:all 0.2s;font-family:'Outfit',sans-serif}
.select-pill.active{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;border-color:transparent;font-weight:600}

/* QUIZ */
.quiz-opt{width:100%;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:14px;cursor:pointer;margin-bottom:10px;text-align:left;transition:all 0.2s}
.quiz-opt:hover{background:rgba(42,82,152,0.2);border-color:#2a5298}
.quiz-opt.correct{background:rgba(0,200,100,0.15);border-color:#00c864;color:#00c864}
.quiz-opt.wrong{background:rgba(255,60,60,0.15);border-color:#ff3c3c;color:#ff6b6b}

/* PROGRESS */
.progress-bar-bg{background:rgba(255,255,255,0.06);border-radius:8px;height:8px;margin-bottom:6px}
.progress-bar{height:8px;border-radius:8px;background:linear-gradient(90deg,#2a5298,#f5b400);transition:width 0.5s}

/* BADGES */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge-item{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:16px 12px;text-align:center}
.badge-item.earned{border-color:rgba(245,180,0,0.3);background:rgba(245,180,0,0.05)}
.badge-emoji{font-size:28px;margin-bottom:6px}
.badge-name{font-size:12px;font-weight:600;margin-bottom:2px}
.badge-desc{font-size:10px;color:#8899bb}

/* LEADERBOARD */
.leaderboard-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,0.03)}
.leaderboard-row.you{background:rgba(42,82,152,0.15);border:1px solid rgba(42,82,152,0.2)}

/* NOTIFICATIONS */
.notif-item{display:flex;gap:14px;padding:14px;border-radius:12px;background:rgba(255,255,255,0.03);margin-bottom:10px;border:1px solid rgba(255,255,255,0.05)}

/* TEXTAREA */
.textarea{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:14px;color:#e8eaf6;font-family:'Outfit',sans-serif;font-size:14px;resize:vertical;min-height:160px;outline:none;line-height:1.6}
.textarea:focus{border-color:#2a5298}
.feedback-box{background:rgba(0,200,100,0.05);border:1px solid rgba(0,200,100,0.15);border-radius:12px;padding:16px;font-size:13px;line-height:1.8;color:#c8d0e8;white-space:pre-wrap;margin-top:14px}
.notes-box{background:rgba(42,82,152,0.1);border:1px solid rgba(42,82,152,0.2);border-radius:12px;padding:18px;font-size:14px;line-height:1.8;color:#c8d0e8;margin-bottom:16px}

/* TEACHER */
.teacher-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.t-tab{padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#8899bb;font-family:'Outfit',sans-serif;transition:all 0.2s}
.t-tab.active{background:linear-gradient(135deg,#1a3a6e,#2a5298);color:#fff;border-color:transparent;font-weight:600}
.student-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,0.03);margin-bottom:8px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.green-chip{background:rgba(0,200,100,0.1);color:#00c864;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
.red-chip{background:rgba(255,60,60,0.1);color:#ff6b6b;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}
.yellow-chip{background:rgba(245,180,0,0.1);color:#f5b400;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600}

/* INSTALL BANNER */
.install-banner{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1a3a6e,#2a5298);border-radius:16px;padding:14px 24px;display:flex;align-items:center;gap:14px;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,0.4);max-width:360px;width:90%}
.install-banner p{font-size:13px;flex:1;line-height:1.4}
.install-btn{background:#f5b400;color:#0a0f1e;border:none;border-radius:10px;padding:8px 16px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.dismiss-btn{background:transparent;border:none;color:rgba(255,255,255,0.5);font-size:18px;cursor:pointer;padding:0 4px}

@media(max-width:768px){
  .sidebar{width:60px}
  .sidebar-logo span:last-child,.sidebar-role,.nav-item span:not(.nav-icon),.points-chip span:last-child{display:none}
  .nav-item{justify-content:center;padding:10px}
  .main{padding:20px 14px}
  .grid2,.grid3{grid-template-columns:1fr}
  .badge-grid{grid-template-columns:1fr 1fr}
  .login-card{padding:32px 24px}
}
</style>
</head>
<body>

<div id="root"></div>

<script>
const SUBJECTS = ["English","Mathematics","Science","Literature"];
const GRADES = ["Grade 8","Grade 9","Grade 10","Grade 11","Grade 12"];
const SAMPLE_NOTES = {
  English:"Literary devices include metaphor, simile, personification, and alliteration. These are used by authors to enhance writing and create vivid imagery. A metaphor is a direct comparison: 'Life is a journey.' A simile uses 'like' or 'as': 'She runs like the wind.'",
  Mathematics:"Quadratic equations take the form ax² + bx + c = 0. They can be solved by factoring, completing the square, or using the quadratic formula: x = (-b ± √(b²-4ac)) / 2a. The discriminant b²-4ac tells us the nature of the roots.",
  Science:"Photosynthesis: 6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂. Plants use chlorophyll to absorb sunlight. The process occurs in two stages: the light-dependent reactions in the thylakoid and the Calvin cycle in the stroma.",
  Literature:"Things Fall Apart by Chinua Achebe follows Okonkwo, an Igbo warrior. The novel explores colonialism's impact on traditional African society. Key themes include masculinity, tradition vs change, and the clash of cultures."
};
const QUIZ_QUESTIONS = {
  English:[
    {q:"What is a metaphor?",options:["A direct comparison without 'like' or 'as'","A comparison using 'like' or 'as'","A type of rhyme scheme","A narrative technique"],answer:0},
    {q:"What does 'protagonist' mean?",options:["The villain of a story","The main character","The narrator","A minor character"],answer:1}
  ],
  Mathematics:[
    {q:"What is the quadratic formula?",options:["x = -b/2a","x = (-b ± √(b²-4ac)) / 2a","x = b² - 4ac","x = a² + b²"],answer:1},
    {q:"What is the value of π approximately?",options:["2.14","3.14","4.13","1.73"],answer:1}
  ],
  Science:[
    {q:"What gas do plants release during photosynthesis?",options:["Carbon dioxide","Nitrogen","Oxygen","Hydrogen"],answer:2},
    {q:"What is the powerhouse of the cell?",options:["Nucleus","Ribosome","Mitochondria","Vacuole"],answer:2}
  ],
  Literature:[
    {q:"Who wrote 'Things Fall Apart'?",options:["Wole Soyinka","Ngugi wa Thiong'o","Chinua Achebe","Nadine Gordimer"],answer:2},
    {q:"What does 'Things Fall Apart' primarily explore?",options:["Romance","Colonial impact on African society","Science fiction","Political satire"],answer:1}
  ]
};
const BADGES=[
  {icon:"🌟",name:"First Quiz",desc:"Complete your first quiz",earned:true},
  {icon:"🔥",name:"On Fire",desc:"3 day study streak",earned:true},
  {icon:"📚",name:"Bookworm",desc:"Read 10 study notes",earned:false},
  {icon:"🏆",name:"Top Student",desc:"Score 90%+ on a quiz",earned:false},
  {icon:"💡",name:"Curious Mind",desc:"Ask 20 AI questions",earned:false},
  {icon:"⚡",name:"Speed Learner",desc:"Complete 5 quizzes in a day",earned:false}
];
const LEADERBOARD=[
  {rank:1,name:"Mutinta C.",grade:"Grade 10",points:2450,badge:"🥇"},
  {rank:2,name:"Chanda M.",grade:"Grade 11",points:2180,badge:"🥈"},
  {rank:3,name:"Lubasi T.",grade:"Grade 9",points:1990,badge:"🥉"},
  {rank:4,name:"Nalwimba K.",grade:"Grade 12",points:1750,badge:"4️⃣"},
  {rank:5,name:"You",grade:"Grade 10",points:1200,badge:"5️⃣"}
];
const ANNOUNCEMENTS=[
  {title:"Mathematics Test",msg:"Grade 10 Mathematics test on Friday. Chapters 5-7.",time:"2h ago",icon:"📐"},
  {title:"Study Reminder",msg:"You have not studied English today. Keep your streak alive!",time:"5h ago",icon:"📖"},
  {title:"New Notes Added",msg:"Science notes for Grade 9 Chapter 12 have been uploaded.",time:"1d ago",icon:"🔬"}
];

// STATE
let screen="login", role=null, activeTab="dashboard";
let subject="Mathematics", grade="Grade 10";
let aiMessages=[{role:"assistant",text:"Mwabonwa! 👋 I am Chenjela, your AI Study Assistant. Ask me anything about your schoolwork and I will explain it step by step! 📚"}];
let aiLoading=false;
let quizActive=false, quizIndex=0, quizAnswers=[], quizDone=false;
let points=1200, streak=3;
let essay="", essayFeedback=null, essayLoading=false;
let teacherTab="overview";
let deferredPrompt=null, showInstallBanner=false;

// PWA INSTALL
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredPrompt=e;
  showInstallBanner=true;
  render();
});

function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{deferredPrompt=null;showInstallBanner=false;render();});
  }
}

// RENDER ENGINE
function render(){
  document.getElementById('root').innerHTML = buildHTML();
  attachEvents();
  if(activeTab==='ai') scrollChat();
}

function scrollChat(){
  const c=document.getElementById('chatArea');
  if(c) c.scrollTop=c.scrollHeight;
}

function buildHTML(){
  let installHTML = showInstallBanner ? `
    <div class="install-banner">
      <p>📱 Install <strong>Chenjela</strong> on your phone for offline access!</p>
      <button class="install-btn" onclick="installApp()">Install</button>
      <button class="dismiss-btn" onclick="showInstallBanner=false;render()">✕</button>
    </div>` : '';

  if(screen==='login') return buildLogin() + installHTML;
  return buildApp() + installHTML;
}

function buildLogin(){
  return `
  <div class="login-bg">
    <div class="login-card">
      <div class="logo">Chenj<span>ela</span></div>
      <div class="tagline">Study Smart — Powered by AI 🇿🇲</div>
      <div class="login-title">Welcome! Sign in as</div>
      <div class="login-sub">Choose your account type to continue</div>
      ${[
        {r:"student",icon:"🎒",label:"Student",sub:"AI help, quizzes & study materials"},
        {r:"teacher",icon:"👨‍🏫",label:"Teacher",sub:"Manage classes & track progress"},
        {r:"parent",icon:"👨‍👩‍👧",label:"Parent",sub:"Monitor your child's learning"}
      ].map(x=>`
        <button class="role-btn" onclick="loginAs('${x.r}')">
          <span style="font-size:22px">${x.icon}</span>
          <div style="text-align:left">
            <div style="font-weight:600">${x.label}</div>
            <div style="font-size:12px;color:#8899bb;margin-top:2px">${x.sub}</div>
          </div>
        </button>`).join('')}
      <div style="text-align:center;font-size:11px;color:#556;margin-top:16px">Made in Zambia 🇿🇲 by Njunjusha Alumba</div>
    </div>
  </div>`;
}

function getNavItems(){
  if(role==='teacher') return [
    {id:"dashboard",icon:"🏠",label:"Dashboard"},
    {id:"tools",icon:"🛠️",label:"Teacher Tools"},
    {id:"progress",icon:"📊",label:"Student Progress"},
    {id:"notifications",icon:"🔔",label:"Notifications"}
  ];
  if(role==='parent') return [
    {id:"dashboard",icon:"🏠",label:"Dashboard"},
    {id:"progress",icon:"📊",label:"Progress"},
    {id:"notifications",icon:"🔔",label:"Notifications"}
  ];
  return [
    {id:"dashboard",icon:"🏠",label:"Dashboard"},
    {id:"ai",icon:"🤖",label:"AI Help"},
    {id:"notes",icon:"📖",label:"Study Notes"},
    {id:"quiz",icon:"✏️",label:"Quiz"},
    {id:"essay",icon:"📝",label:"Essay Help"},
    {id:"progress",icon:"📊",label:"Progress"},
    {id:"rewards",icon:"🏆",label:"Rewards"},
    {id:"notifications",icon:"🔔",label:"Alerts"}
  ];
}

function buildApp(){
  const nav = getNavItems();
  return `
  <div class="app-shell">
    <div class="sidebar">
      <div class="sidebar-logo">Chenj<span>ela</span></div>
      <div class="sidebar-role">${role} account</div>
      ${nav.map(n=>`
        <div class="nav-item ${activeTab===n.id?'active':''}" onclick="setTab('${n.id}')">
          <span class="nav-icon">${n.icon}</span>
          <span>${n.label}</span>
        </div>`).join('')}
      <div class="sidebar-bottom">
        <div class="points-chip">🏅 <span>${points.toLocaleString()} pts</span></div>
        <button class="logout-btn" onclick="logout()">← Sign Out</button>
      </div>
    </div>
    <div class="main" id="mainContent">
      ${renderContent()}
    </div>
  </div>`;
}

function renderContent(){
  if(role==='teacher'){
    if(activeTab==='dashboard') return buildTeacherDashboard();
    if(activeTab==='tools') return buildTeacherTools();
    if(activeTab==='progress') return buildStudentProgress();
    if(activeTab==='notifications') return buildNotifications();
  }
  if(role==='parent'){
    if(activeTab==='dashboard') return buildParentDashboard();
    if(activeTab==='progress') return buildProgress();
    if(activeTab==='notifications') return buildNotifications();
  }
  if(activeTab==='dashboard') return buildStudentDashboard();
  if(activeTab==='ai') return buildAI();
  if(activeTab==='notes') return buildNotes();
  if(activeTab==='quiz') return buildQuiz();
  if(activeTab==='essay') return buildEssay();
  if(activeTab==='progress') return buildProgress();
  if(activeTab==='rewards') return buildRewards();
  if(activeTab==='notifications') return buildNotifications();
  return '';
}

function subjectPills(){
  return `<div class="select-row">${SUBJECTS.map(s=>`<button class="select-pill ${subject===s?'active':''}" onclick="setSubject('${s}')">${s}</button>`).join('')}</div>`;
}
function gradePills(){
  return `<div class="select-row">${GRADES.map(g=>`<button class="select-pill ${grade===g?'active':''}" onclick="setGrade('${g}')">${g}</button>`).join('')}</div>`;
}

function buildStudentDashboard(){
  return `
    <div class="page-title">Good day! 👋</div>
    <div class="page-sub">Keep your ${streak}-day study streak alive! Mwizenge! 🔥</div>
    <div class="grid3">
      <div class="stat-card"><div class="stat-icon">⚡</div><div class="stat-val" style="color:#f5b400">${streak} Days</div><div class="stat-label">Study Streak</div></div>
      <div class="stat-card"><div class="stat-icon">🏅</div><div class="stat-val" style="color:#2a5298">${points.toLocaleString()}</div><div class="stat-label">Total Points</div></div>
      <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-val" style="color:#00c864">14</div><div class="stat-label">Quizzes Done</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="section-title">📚 Quick Study</div>
        ${subjectPills()}
        <div class="notes-box">${SAMPLE_NOTES[subject]}</div>
        <button class="primary-btn" onclick="setTab('ai')">Ask AI About This →</button>
      </div>
      <div class="card">

async function sendAI(){
  const input=document.getElementById('aiInput');
  if(!input||!input.value.trim()||aiLoading) return;
  const userMsg=input.value.trim();
  aiMessages.push({role:'user',text:userMsg});
  aiLoading=true;
  render();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:`You are Chenjela, a friendly AI study assistant for Zambian secondary school students (Grades 8-12). Help with English, Mathematics, Science, and Literature. Give clear step-by-step explanations. Use simple language appropriate for Zambian students. Reference the Zambian curriculum where relevant. Be warm and encouraging. Occasionally use Zambian expressions like 'Mwashinka!' (Well done!) to feel local. Keep answers concise but complete. Current subject: ${subject}, Grade: ${grade}.`,
        messages:aiMessages.filter((_,i)=>i>0||aiMessages[0].role!=='assistant').map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))
      })
    });
    const data=await res.json();
    const reply=data.content?.map(c=>c.text||'').join('')||'Sorry, I could not get a response. Please try again.';
    aiMessages.push({role:'assistant',text:reply});
    points+=10;
  }catch{
    aiMessages.push({role:'assistant',text:'Connection error. Please check your internet and try again.'});
  }
  aiLoading=false;
  render();
}

async function checkEssay(){
  const input=document.getElementById('essayInput');
  if(!input||!input.value.trim()||essayLoading) return;
  essay=input.value.trim();
  essayLoading=true;
  essayFeedback=null;
  render();
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'You are an English teacher for Zambian secondary school students. Review the writing and provide: 1) A score out of 10, 2) Three specific strengths, 3) Three specific improvements needed. Be encouraging and constructive. Format clearly with sections.',
        messages:[{role:'user',content:`Please review this writing:\n\n${essay}`}]
      })
    });
    const data=await res.
